services:
  frontend:
    image: ghcr.io/your-org/your-app-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"

  backend:
    image: ghcr.io/your-org/your-app-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: database
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: app
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
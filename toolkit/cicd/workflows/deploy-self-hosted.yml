name: Deploy via Self-Hosted Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - production
    steps:
      - run: |
          cd /opt/myapp
          ./deploy.py
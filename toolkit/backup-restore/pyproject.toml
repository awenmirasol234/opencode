[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-restore-toolkit"
version = "0.1.0"
description = "A small backup and restore toolkit for Docker Compose projects."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
backup-restore = "backup_restore.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

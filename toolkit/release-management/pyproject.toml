[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "release-management-toolkit"
version = "0.1.0"
description = "A small release management toolkit for Docker Compose projects."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
release = "release_management.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

services:
  app:
    depends_on:
      db:
        condition: service_healthy
  db:
    image: "${DATABASE_IMAGE:?Set DATABASE_IMAGE}"
    volumes:
      - "database-data:${DATABASE_DATA_PATH:?Set DATABASE_DATA_PATH}"
    healthcheck:
      test:
        - CMD-SHELL
        - "${DATABASE_HEALTHCHECK_COMMAND:?Set DATABASE_HEALTHCHECK_COMMAND}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  database-data:

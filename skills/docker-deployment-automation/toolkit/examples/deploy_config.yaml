# The same configuration as deploy_config.py, in YAML form.
# Commands are lists and are never run through a shell.

project_dir: "."
compose_files:
  - compose.yaml
env_file: .env
required_env:
  - APP_ENV
required_images: []
required_services: []

deployment:
  commit_sha_env: GIT_COMMIT_SHA
  state_file: .deployment/current-sha
  require_previous_sha: false

locks:
  enabled: true
  file: .deployment/deployment.lock

backup:
  enabled: true
  dir: backups
  paths:
    - compose.yaml
    - .env.example

directories:
  log_dir: logs
  temp_paths:
    - .deployment-tmp
  protected_paths:
    - data

services:
  database:
    services: []
    start_args:
      - up
      - -d
    readiness_command: []
    readiness_timeout: 120
    readiness_interval: 5
    readiness_retries: 30
    backup_command: []
    backup_file: database.backup

health:
  timeout: 120
  interval: 5
  checks:
    - name: Replace with the application health check
      type: url
      url: http://127.0.0.1:8080/health
      expected_status: 200

compose:
  pull_args:
    - pull
  deploy_args:
    - up
    - -d
  rollback_args:
    - up
    - -d

rollback:
  command:
    - python
    - scripts/rollback.py
    - "{backup_dir}"

hooks: {}

cleanup:
  enabled: true
